name: docker-release
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Hub 登录
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 取日期 tag
        id: date
        run: echo "tag=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nextmusic:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nextmusic:${{ steps.date.outputs.tag }}
